<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · {{ site_name }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v={{ release_name }}" />
  <style>
    body.login-body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 1.5rem;
      background:
        radial-gradient(700px 360px at 20% 0%, rgba(249, 66, 58, 0.14), transparent 55%),
        radial-gradient(600px 320px at 90% 20%, rgba(45, 212, 191, 0.06), transparent 50%),
        #000;
    }
    .login-card {
      width: min(400px, 100%);
      background: #141414;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.6rem 1.5rem 1.4rem;
      box-shadow: 0 24px 48px rgba(0,0,0,0.45);
    }
    .login-brand {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.35rem;
    }
    .login-brand .brand-badge {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 0.7rem; border-radius: 999px;
      background: #F9423A; color: #fff;
      font-family: Sora, sans-serif; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.08em;
    }
    .login-brand strong {
      display: block; font-family: Sora, sans-serif; font-size: 1.05rem; color: #fff;
    }
    .login-brand span { display: block; font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 0.15rem; }
    .login-card h1 {
      margin: 0 0 0.35rem; font-family: Sora, sans-serif;
      font-size: 1.35rem; letter-spacing: -0.02em; color: #fff;
    }
    .login-card .hint { margin: 0 0 1.1rem; color: rgba(255,255,255,0.5); font-size: 0.88rem; }
    .login-card label {
      display: block; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin: 0 0 0.35rem;
    }
    .login-card input {
      width: 100%; box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a0a; color: #f0f0f0;
      border-radius: 10px; padding: 0.7rem 0.85rem;
      font: inherit; margin-bottom: 0.85rem;
    }
    .login-card input:focus {
      outline: none; border-color: rgba(249, 66, 58, 0.55);
      box-shadow: 0 0 0 3px rgba(249, 66, 58, 0.15);
    }
    .login-error {
      background: rgba(249, 66, 58, 0.12);
      border: 1px solid rgba(249, 66, 58, 0.35);
      color: #fb7185; border-radius: 10px;
      padding: 0.65rem 0.8rem; font-size: 0.88rem; margin-bottom: 0.9rem;
    }
    .login-card .btn {
      width: 100%; justify-content: center;
      background: #F9423A; border: 0; color: #fff;
      margin-top: 0.35rem; padding: 0.75rem 1rem;
    }
    .login-card .btn:hover { filter: brightness(1.06); }
    .login-meta {
      margin-top: 1rem; font-size: 0.72rem; color: rgba(255,255,255,0.35);
      text-align: center;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-badge">GRID</span>
      <div>
        <strong>{{ site_name }}</strong>
        <span>{{ release_name }} · auth: {{ provider }}</span>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="hint">Operator access for Facility · IT · Cloud observability</p>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}" />
      <label for="username">ID</label>
      <input id="username" name="username" type="text" required autofocus placeholder="krafton" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="••••••••" />
      <button class="btn" type="submit">Continue</button>
    </form>
    <p class="login-meta">Local demo auth · Krafton account SSO module reserved</p>
  </div>
</body>
</html>
