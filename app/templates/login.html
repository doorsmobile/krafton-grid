<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Krafton Grid</title><link rel="icon" href="/static/brand/mark.svg"><link rel="stylesheet" href="/static/css/grid.css"></head>
<body><div class="login-wrap"><form class="login-card" method="post" action="/login">
  <div class="brand" style="border:0;padding:0 0 16px"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 3h4.2v7.4L15.6 3H21l-7.6 8.4L21.4 21h-5.5l-5.3-7-1.4 1.5V21H5z"/></svg></span><span><b>Krafton Grid</b><small>{{ RELEASE }}</small></span></div>
  <div class="col"><label class="small muted">ID<input class="input" name="username" autocomplete="username" style="width:100%;margin-top:4px" required></label>
  <label class="small muted">Password<input class="input" type="password" name="password" autocomplete="current-password" style="width:100%;margin-top:4px" required></label>
  <input type="hidden" name="next" value="{{ d.next }}">
  {% if d.error %}<div class="note warn">{{ d.error }}</div>{% endif %}
  <button class="btn primary" style="width:100%;height:38px">Sign in</button>
  <div class="xs faint">Local account (AUTH_ENABLED=1). SSO provider can replace app/web/routers/auth.py.</div></div>
</form></div></body></html>
