# Krafton Grid (grid-claude) — HTTPS only for __DOMAIN__
# Rendered by deploy/setup_ec2.sh from DOMAIN in /etc/krafton-grid/grid.env — edit the template, not the server copy.
#
#   https://__DOMAIN__          the site (HTTP/2)
#   https://<aliases>           301 → https://__DOMAIN__
#   https://<ip> / unknown SNI  TLS handshake refused
#   http://*                    no site: only Let's Encrypt renewal challenges are answered, everything else is dropped

# :80 — certificate renewal only (Let's Encrypt HTTP-01 needs port 80). No redirect, no content.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 444;                            # close the connection without a response
    }
}

# :443 catch-all — requests by IP address or for any other host name never get a TLS session
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# BEGIN ALIASES
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __ALIASES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}
# END ALIASES

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                  # also lifts the browser's 6-connections-per-host limit
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(stream|observability/agent/stream)$ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_read_timeout 120s;
    }
}
