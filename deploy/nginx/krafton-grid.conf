# Krafton Grid (grid-claude) — nginx in front of uvicorn on 127.0.0.1:8003
# HTTPS later: point a domain at this host, then `sudo certbot --nginx -d <domain>`.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events: live snapshot stream and Mission Control answers — never buffer
    location ~ ^/api/(stream|observability/agent/stream)$ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_read_timeout 120s;
    }
}
